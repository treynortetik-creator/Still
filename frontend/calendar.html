<!DOCTYPE html>
<html lang="en" data-theme="dark" class="no-transitions">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/static/images/Icon only.png">
    <title>Content Calendar - Still</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="/static/theme.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        still: {
                            bg: 'var(--still-bg)',
                            card: 'var(--still-card)',
                            border: 'var(--still-border)',
                            text: 'var(--still-text)',
                            muted: 'var(--still-muted)',
                            disabled: 'var(--still-disabled)',
                            copper: 'var(--still-copper)',
                            amber: 'var(--still-amber)',
                            green: 'var(--still-green)',
                            error: 'var(--still-error)',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/utils.js"></script>
    <script src="/static/auth.js"></script>
    <script src="/static/components.js"></script>
    <script>
        window.addEventListener('load', () => {
            document.documentElement.classList.remove('no-transitions');
        });
    </script>
</head>
<body class="bg-still-bg min-h-screen font-sans">
    <!-- Navigation -->
    <div id="nav-container"></div>

    <div class="max-w-7xl mx-auto px-4 py-8">
        <!-- Header -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-still-text">Content Calendar</h1>
            <div class="flex items-center gap-4">
                <div class="flex gap-2">
                    <button onclick="prevMonth()" class="p-2 border border-still-border rounded-lg hover:bg-still-card text-still-text">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                        </svg>
                    </button>
                    <button onclick="nextMonth()" class="p-2 border border-still-border rounded-lg hover:bg-still-card text-still-text">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                        </svg>
                    </button>
                </div>
                <span id="current-month" class="text-lg font-semibold text-still-text">January 2025</span>
                <button onclick="goToToday()" class="px-3 py-1 text-sm border border-still-border rounded-lg hover:bg-still-card text-still-text">Today</button>
            </div>
        </div>

        <div class="flex gap-6">
            <!-- Calendar Grid -->
            <div class="flex-1">
                <div class="bg-still-card rounded-lg shadow-sm overflow-hidden">
                    <!-- Day Headers -->
                    <div class="grid grid-cols-7 bg-still-bg border-b border-still-border">
                        <div class="p-3 text-center text-sm font-medium text-still-muted">Sun</div>
                        <div class="p-3 text-center text-sm font-medium text-still-muted">Mon</div>
                        <div class="p-3 text-center text-sm font-medium text-still-muted">Tue</div>
                        <div class="p-3 text-center text-sm font-medium text-still-muted">Wed</div>
                        <div class="p-3 text-center text-sm font-medium text-still-muted">Thu</div>
                        <div class="p-3 text-center text-sm font-medium text-still-muted">Fri</div>
                        <div class="p-3 text-center text-sm font-medium text-still-muted">Sat</div>
                    </div>
                    <!-- Calendar Days -->
                    <div id="calendar-grid" class="grid grid-cols-7">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>

            <!-- Sidebar: Unscheduled Content -->
            <div class="w-80">
                <div class="bg-still-card rounded-lg shadow-sm p-4">
                    <h2 class="font-semibold text-still-text mb-4">Unscheduled Content</h2>
                    <div id="unscheduled-list" class="space-y-3 max-h-[600px] overflow-y-auto">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Schedule Modal -->
    <div id="schedule-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
        <div class="bg-still-card rounded-lg max-w-md w-full border border-still-border">
            <div class="p-6 border-b border-still-border">
                <div class="flex justify-between items-center">
                    <h3 id="schedule-modal-title" class="text-lg font-semibold text-still-text">Schedule Content</h3>
                    <button onclick="hideScheduleModal()" class="text-still-muted hover:text-still-text">&times;</button>
                </div>
            </div>
            <form id="schedule-form" class="p-6 space-y-4">
                <input type="hidden" id="schedule-output-id">
                <input type="hidden" id="schedule-id">

                <div id="content-preview-box" class="p-3 bg-still-bg rounded-lg text-sm text-still-muted max-h-32 overflow-y-auto">
                    <!-- Content preview -->
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-still-muted mb-1">Date</label>
                        <input type="date" id="schedule-date" required
              class="w-full rounded-lg p-2 input-premium" >
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-still-muted mb-1">Time</label>
                        <input type="time" id="schedule-time" value="09:00"
              class="w-full rounded-lg p-2 input-premium" >
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-still-muted mb-1">Platform</label>
                    <select id="schedule-platform" class="w-full rounded-lg p-2 input-premium select-premium" >
                        <option value="linkedin">LinkedIn</option>
                        <option value="blog">Blog</option>
                        <option value="email">Email</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-still-muted mb-1">Notes (optional)</label>
                    <textarea id="schedule-notes" rows="2"
                        class="w-full border border-still-border rounded-lg p-2 bg-still-bg text-still-text"
                        placeholder="Add a note for this scheduled post..."></textarea>
                </div>

                <div class="flex gap-3">
                    <button type="submit" class="flex-1 btn btn-primary text-white py-2 rounded-lg">
                        Schedule
                    </button>
                    <button type="button" onclick="hideScheduleModal()" class="px-4 py-2 border border-still-border rounded-lg hover:bg-still-bg text-still-text">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Day Detail Modal -->
    <div id="day-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
        <div class="bg-still-card rounded-lg max-w-lg w-full max-h-[80vh] overflow-hidden border border-still-border">
            <div class="p-6 border-b border-still-border flex justify-between items-center">
                <h3 id="day-modal-title" class="text-lg font-semibold text-still-text">January 15, 2025</h3>
                <button onclick="hideDayModal()" class="text-still-muted hover:text-still-text">&times;</button>
            </div>
            <div id="day-modal-content" class="p-6 overflow-y-auto max-h-[60vh]">
                <!-- Day items populated by JS -->
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="hidden fixed bottom-4 right-4 bg-still-card text-still-text px-4 py-3 rounded-lg shadow-lg z-50 border border-still-border"></div>

    <script>
        // Require authentication
        Auth.requireAuth();

        // Platform colors (dark theme compatible)
        const platformColors = {
            linkedin: { bg: 'platform-linkedin', border: '', text: '' },
            blog: { bg: 'bg-still-green/30', border: 'border-still-green', text: 'text-still-green' },
            email: { bg: 'platform-email', border: '', text: '' },
            email_sequence: { bg: 'bg-pink-900/30', border: 'border-pink-500', text: 'text-pink-400' }
        };

        let currentDate = new Date();
        let calendarData = { days: {}, unscheduled: [] };

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadCalendar();
        });

        function getMonthRange(date) {
            const year = date.getFullYear();
            const month = date.getMonth();
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            return {
                start: firstDay.toISOString().split('T')[0],
                end: lastDay.toISOString().split('T')[0]
            };
        }

        async function loadCalendar() {
            const range = getMonthRange(currentDate);
            const monthName = currentDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
            document.getElementById('current-month').textContent = monthName;

            try {
                const response = await Auth.fetchWithAuth(
                    `/api/calendar?start_date=${range.start}&end_date=${range.end}`
                );
                if (!response.ok) throw new Error('Failed to load calendar');

                calendarData = await response.json();
                renderCalendarGrid();
                renderUnscheduledList();
            } catch (err) {
                console.error('Error loading calendar:', err);
                showToast('Failed to load calendar', 'error');
            }
        }

        function renderCalendarGrid() {
            const grid = document.getElementById('calendar-grid');
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startDayOfWeek = firstDay.getDay();
            const daysInMonth = lastDay.getDate();

            const today = new Date().toISOString().split('T')[0];

            let html = '';

            // Empty cells for days before first of month
            for (let i = 0; i < startDayOfWeek; i++) {
                html += '<div class="min-h-[100px] p-2 border-b border-r border-still-border bg-still-bg"></div>';
            }

            // Days of the month
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const items = calendarData.days[dateStr] || [];
                const isToday = dateStr === today;

                html += `
                    <div class="min-h-[100px] p-2 border-b border-r border-still-border ${isToday ? 'bg-still-copper/10' : 'bg-still-card'} hover:bg-still-border cursor-pointer transition-all duration-200"
                         onclick="showDayModal('${dateStr}')"
                         ondragover="event.preventDefault(); this.classList.add('calendar-drop-target')"
                         ondragleave="this.classList.remove('calendar-drop-target')"
                         ondrop="handleDrop(event, '${dateStr}')">
                        <div class="flex justify-between items-start">
                            <span class="text-sm font-medium ${isToday ? 'text-still-copper' : 'text-still-text'}">${day}</span>
                            ${items.length > 0 ? `<span class="text-xs text-still-muted">${items.length}</span>` : ''}
                        </div>
                        <div class="mt-1 space-y-1">
                            ${items.slice(0, 3).map(item => {
                                const colors = platformColors[item.platform] || platformColors.linkedin;
                                return `
                                    <div class="text-xs p-1 rounded truncate ${colors.bg} ${colors.text ? colors.text : ''} ${colors.border ? 'border-l-2 ' + colors.border : ''}">
                                        ${item.content_preview.substring(0, 30)}...
                                    </div>
                                `;
                            }).join('')}
                            ${items.length > 3 ? `<div class="text-xs text-still-muted">+${items.length - 3} more</div>` : ''}
                        </div>
                    </div>
                `;
            }

            // Fill remaining cells
            const totalCells = startDayOfWeek + daysInMonth;
            const remaining = 7 - (totalCells % 7);
            if (remaining < 7) {
                for (let i = 0; i < remaining; i++) {
                    html += '<div class="min-h-[100px] p-2 border-b border-r border-still-border bg-still-bg"></div>';
                }
            }

            grid.innerHTML = html;
        }

        function renderUnscheduledList() {
            const container = document.getElementById('unscheduled-list');

            if (calendarData.unscheduled.length === 0) {
                container.innerHTML = '<p class="text-still-muted text-sm text-center py-4">No unscheduled content</p>';
                return;
            }

            container.innerHTML = calendarData.unscheduled.map(item => {
                const colors = platformColors[item.content_type] || platformColors.linkedin;
                const safePreview = escapeJs(item.content_preview);
                return `
                    <div class="p-3 bg-still-bg rounded-lg ${colors.border ? 'border-l-4 ' + colors.border : ''} cursor-grab"
                         draggable="true"
                         ondragstart="handleDragStart(event, ${item.output_id}, '${safePreview}', '${item.content_type}')">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="px-2 py-0.5 ${colors.bg} ${colors.text ? colors.text : ''} rounded text-xs">${item.content_type}</span>
                        </div>
                        <p class="text-sm text-still-muted line-clamp-2">${escapeHtml(item.content_preview)}</p>
                        <button onclick="openScheduleModal(${item.output_id}, '${safePreview}', '${item.content_type}')"
                            class="mt-2 text-xs text-still-copper hover:underline">
                            Schedule
                        </button>
                    </div>
                `;
            }).join('');
        }

        // Drag and drop
        let dragData = null;

        function handleDragStart(event, outputId, preview, contentType) {
            dragData = { outputId, preview, contentType };
            event.dataTransfer.effectAllowed = 'move';
        }

        function handleDrop(event, dateStr) {
            event.preventDefault();
            event.currentTarget.classList.remove('calendar-drop-target');

            if (dragData) {
                openScheduleModal(dragData.outputId, dragData.preview, dragData.contentType, dateStr);
                dragData = null;
            }
        }

        // Navigation
        function prevMonth() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            loadCalendar();
        }

        function nextMonth() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            loadCalendar();
        }

        function goToToday() {
            currentDate = new Date();
            loadCalendar();
        }

        // Schedule Modal
        function openScheduleModal(outputId, preview, contentType, presetDate = null) {
            document.getElementById('schedule-output-id').value = outputId;
            document.getElementById('schedule-id').value = '';
            document.getElementById('content-preview-box').textContent = preview;
            document.getElementById('schedule-platform').value = contentType === 'email_sequence' ? 'email' : contentType;
            document.getElementById('schedule-date').value = presetDate || new Date().toISOString().split('T')[0];
            document.getElementById('schedule-time').value = '09:00';
            document.getElementById('schedule-notes').value = '';
            document.getElementById('schedule-modal-title').textContent = 'Schedule Content';
            document.getElementById('schedule-modal').classList.remove('hidden');
        }

        function hideScheduleModal() {
            document.getElementById('schedule-modal').classList.add('hidden');
        }

        document.getElementById('schedule-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const outputId = document.getElementById('schedule-output-id').value;
            const scheduleId = document.getElementById('schedule-id').value;
            const isEdit = !!scheduleId;

            const data = {
                output_id: parseInt(outputId),
                scheduled_date: document.getElementById('schedule-date').value,
                scheduled_time: document.getElementById('schedule-time').value + ':00',
                platform: document.getElementById('schedule-platform').value,
                notes: document.getElementById('schedule-notes').value || null
            };

            try {
                const url = isEdit ? `/api/calendar/schedule/${scheduleId}` : '/api/calendar/schedule';
                const method = isEdit ? 'PUT' : 'POST';

                const response = await Auth.fetchWithAuth(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.detail || 'Failed to schedule');
                }

                hideScheduleModal();
                loadCalendar();
                showToast(isEdit ? 'Schedule updated' : 'Content scheduled');
            } catch (err) {
                showToast(err.message, 'error');
            }
        });

        // Day Modal
        function showDayModal(dateStr) {
            const items = calendarData.days[dateStr] || [];
            const date = new Date(dateStr + 'T12:00:00');
            const formattedDate = date.toLocaleDateString('en-US', {
                weekday: 'long',
                month: 'long',
                day: 'numeric',
                year: 'numeric'
            });

            document.getElementById('day-modal-title').textContent = formattedDate;

            if (items.length === 0) {
                document.getElementById('day-modal-content').innerHTML = `
                    <p class="text-still-muted text-center py-8">No content scheduled for this day</p>
                `;
            } else {
                document.getElementById('day-modal-content').innerHTML = items.map(item => {
                    const colors = platformColors[item.platform] || platformColors.linkedin;
                    return `
                        <div class="p-4 mb-3 rounded-lg ${colors.border ? 'border-l-4 ' + colors.border : ''} ${colors.bg}">
                            <div class="flex justify-between items-start mb-2">
                                <div class="flex items-center gap-2">
                                    <span class="px-2 py-1 bg-still-card rounded text-xs font-medium ${colors.text ? colors.text : ''}">${item.platform}</span>
                                    <span class="text-sm text-still-muted">${item.scheduled_time.substring(0, 5)}</span>
                                </div>
                                <div class="flex gap-2">
                                    <button onclick="editSchedule(${item.id})" class="text-still-muted hover:text-still-text">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                                        </svg>
                                    </button>
                                    <button onclick="deleteSchedule(${item.id})" class="text-still-muted hover:text-still-error">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                            <p class="text-sm text-still-muted">${escapeHtml(item.content_preview)}</p>
                            ${item.notes ? `<p class="text-xs text-still-disabled mt-2 italic">${escapeHtml(item.notes)}</p>` : ''}
                        </div>
                    `;
                }).join('');
            }

            document.getElementById('day-modal').classList.remove('hidden');
        }

        function hideDayModal() {
            document.getElementById('day-modal').classList.add('hidden');
        }

        async function editSchedule(scheduleId) {
            hideDayModal();
            try {
                const response = await Auth.fetchWithAuth(`/api/calendar/schedule/${scheduleId}`);
                if (!response.ok) throw new Error('Failed to load schedule');

                const schedule = await response.json();

                document.getElementById('schedule-output-id').value = schedule.output_id;
                document.getElementById('schedule-id').value = schedule.id;
                document.getElementById('content-preview-box').textContent = schedule.content_preview;
                document.getElementById('schedule-date').value = schedule.scheduled_date;
                document.getElementById('schedule-time').value = schedule.scheduled_time.substring(0, 5);
                document.getElementById('schedule-platform').value = schedule.platform;
                document.getElementById('schedule-notes').value = schedule.notes || '';
                document.getElementById('schedule-modal-title').textContent = 'Edit Schedule';
                document.getElementById('schedule-modal').classList.remove('hidden');
            } catch (err) {
                showToast('Failed to load schedule', 'error');
            }
        }

        async function deleteSchedule(scheduleId) {
            if (!confirm('Remove this from the calendar?')) return;

            try {
                const response = await Auth.fetchWithAuth(`/api/calendar/schedule/${scheduleId}`, {
                    method: 'DELETE'
                });
                if (!response.ok) throw new Error('Failed to delete');

                hideDayModal();
                loadCalendar();
                showToast('Removed from calendar');
            } catch (err) {
                showToast('Failed to remove', 'error');
            }
        }

        // escapeHtml and showToast are now provided by utils.js

        // Escape string for use in JavaScript string literals (single-quoted)
        function escapeJs(str) {
            if (!str) return '';
            return str
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'")
                .replace(/"/g, '\\"')
                .replace(/\n/g, '\\n')
                .replace(/\r/g, '\\r');
        }
    </script>
</body>
</html>
