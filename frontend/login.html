<!DOCTYPE html>
<html lang="en" data-theme="dark" class="no-transitions">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/static/images/Icon only.png">
    <title>Login - Still</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="/static/theme.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        still: {
                            bg: 'var(--still-bg)',
                            card: 'var(--still-card)',
                            border: 'var(--still-border)',
                            text: 'var(--still-text)',
                            muted: 'var(--still-muted)',
                            disabled: 'var(--still-disabled)',
                            copper: 'var(--still-copper)',
                            amber: 'var(--still-amber)',
                            green: 'var(--still-green)',
                            error: 'var(--still-error)',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
    <script>
        window.addEventListener('load', () => {
            document.documentElement.classList.remove('no-transitions');
        });
    </script>
</head>
<body class="bg-still-bg min-h-screen flex items-center justify-center">
    <!-- Theme Toggle (floating) -->
    <div class="fixed top-4 right-4">
        <button onclick="ThemeManager.toggle()" class="theme-toggle" title="Toggle light/dark mode">
            <svg class="theme-icon-sun" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
            </svg>
            <svg class="theme-icon-moon hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
            </svg>
        </button>
    </div>

    <div class="max-w-md w-full mx-4">
        <!-- Logo/Header -->
        <div class="text-center mb-8">
            <a href="/" class="inline-block">
                <img src="/static/images/Still Logo.svg" alt="Still" class="h-20 mx-auto">
            </a>
            <p class="text-still-muted mt-4">Sign in to your account</p>
        </div>

        <!-- Login Form -->
        <div class="bg-still-card rounded-lg shadow-sm p-8">
            <form id="login-form" class="space-y-6">
                <div>
                    <label for="email" class="block text-sm font-medium text-still-text mb-1">
                        Email address
                    </label>
                    <input type="email" id="email" name="email" required
            class="w-full px-4 py-3 rounded-lg input-premium" placeholder="you@example.com">
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-still-text mb-1">
                        Password
                    </label>
                    <input type="password" id="password" name="password" required
            class="w-full px-4 py-3 rounded-lg input-premium" placeholder="Enter your password">
                </div>

                <!-- Error Message -->
                <div id="error-message" class="hidden p-3 bg-still-error/10 border border-still-error/30 rounded-lg text-still-error text-sm">
                </div>

                <button type="submit" id="submit-btn"
          class="btn btn-primary btn-lg w-full">
                    Sign in
                </button>
            </form>

            <div class="mt-6 text-center text-sm text-still-muted">
                Don't have an account?
                <a href="/register.html" class="text-still-copper hover:underline font-medium">
                    Create one
                </a>
            </div>
        </div>

        <!-- Back to home -->
        <div class="text-center mt-6">
            <a href="/" class="text-still-muted hover:text-still-text text-sm">
                &larr; Back to home
            </a>
        </div>
    </div>

    <script>
        // Check if already logged in
        const token = localStorage.getItem('auth_token');
        if (token) {
            // Verify token is still valid
            fetch('/api/auth/me', {
                headers: { 'Authorization': `Bearer ${token}` }
            }).then(res => {
                if (res.ok) {
                    window.location.href = '/upload.html';
                } else {
                    localStorage.removeItem('auth_token');
                    localStorage.removeItem('user');
                }
            });
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = document.getElementById('submit-btn');
            const errorDiv = document.getElementById('error-message');

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';
            errorDiv.classList.add('hidden');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Store token and user info
                    localStorage.setItem('auth_token', data.access_token);
                    localStorage.setItem('user', JSON.stringify(data.user));

                    // Redirect to upload page
                    window.location.href = '/upload.html';
                } else {
                    throw new Error(data.detail || 'Login failed');
                }
            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign in';
            }
        });
    </script>
</body>
</html>
