<!DOCTYPE html>
<html lang="en" data-theme="dark" class="no-transitions">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/static/images/Icon only.png">
    <title>Content Library - Still</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="/static/theme.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        still: {
                            bg: 'var(--still-bg)',
                            card: 'var(--still-card)',
                            border: 'var(--still-border)',
                            text: 'var(--still-text)',
                            muted: 'var(--still-muted)',
                            disabled: 'var(--still-disabled)',
                            copper: 'var(--still-copper)',
                            amber: 'var(--still-amber)',
                            green: 'var(--still-green)',
                            error: 'var(--still-error)',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/utils.js"></script>
    <script src="/static/auth.js"></script>
    <script src="/static/components.js"></script>
    <script>
        window.addEventListener('load', () => {
            document.documentElement.classList.remove('no-transitions');
        });
    </script>
</head>
<body class="bg-still-bg min-h-screen">
    <!-- Navigation -->
    <div id="nav-container"></div>

    <div class="max-w-7xl mx-auto px-4 py-8">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-still-text">Content Library</h1>
                <p class="text-still-muted mt-1" id="library-stats">Loading...</p>
            </div>
            <button id="generate-btn" disabled
                class="btn btn-primary text-white px-4 py-2 rounded-lg transition disabled:opacity-50 disabled:cursor-not-allowed">
                Generate from Selected (<span id="selected-count">0</span>)
            </button>
        </div>

        <!-- Filters -->
        <div class="bg-still-card rounded-lg shadow-sm p-4 mb-6 border border-still-border">
            <div class="flex flex-wrap gap-4">
                <!-- Type Filter -->
                <div>
                    <label class="block text-sm font-medium text-still-text mb-1">Type</label>
                    <select id="filter-type" class="input-premium select-premium" >
                        <option value="">All Types</option>
                        <option value="data">Data</option>
                        <option value="story">Story</option>
                        <option value="insight">Insight</option>
                        <option value="problem">Problem</option>
                        <option value="solution">Solution</option>
                    </select>
                </div>

                <!-- Persona Filter -->
                <div>
                    <label class="block text-sm font-medium text-still-text mb-1">Persona</label>
                    <select id="filter-persona" class="input-premium select-premium" >
                        <option value="">All Personas</option>
                    </select>
                </div>

                <!-- Min Relevance -->
                <div>
                    <label class="block text-sm font-medium text-still-text mb-1">Min Relevance</label>
                    <select id="filter-relevance" class="input-premium select-premium" >
                        <option value="1">1+</option>
                        <option value="2">2+</option>
                        <option value="3">3+</option>
                        <option value="4">4+</option>
                        <option value="5">5 only</option>
                    </select>
                </div>

                <!-- Search -->
                <div class="flex-1">
                    <label class="block text-sm font-medium text-still-text mb-1">Search</label>
                    <input type="text" id="filter-search" placeholder="Search content..."
            class="w-full input-premium" >
                </div>

                <div class="flex items-end">
                    <button id="apply-filters" class="bg-still-border text-still-text px-4 py-2 rounded-lg hover:bg-still-muted hover:text-still-bg transition">
                        Apply Filters
                    </button>
                </div>
            </div>
        </div>

        <!-- Library Grid -->
        <div id="library-container" class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
            <div class="col-span-full text-center py-12">
                <div class="animate-spin h-8 w-8 border-4 border-still-copper border-t-transparent rounded-full mx-auto"></div>
                <p class="mt-4 text-still-muted">Loading library...</p>
            </div>
        </div>

        <!-- Pagination -->
        <div class="mt-8 flex justify-center gap-2" id="pagination"></div>
    </div>

    <!-- Generate Modal -->
    <div id="generate-modal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50">
        <div class="bg-still-card rounded-lg shadow-xl max-w-md w-full mx-4 p-6 border border-still-border">
            <h2 class="text-xl font-bold mb-4 text-still-text">Generate Content from Library</h2>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-still-text mb-1">Target Persona</label>
                    <select id="gen-persona" class="w-full input-premium select-premium" >
                        <option value="">Loading personas...</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-still-text mb-1">Content Types</label>
                    <div class="space-y-2">
                        <label class="flex items-center text-still-text">
                            <input type="checkbox" id="gen-linkedin" checked class="rounded border-still-border input-premium" >
                            <span class="ml-2">LinkedIn Posts</span>
                            <input type="number" id="gen-linkedin-qty" value="2" min="1" max="5"
                class="ml-auto w-16 input-premium" >
                        </label>
                        <label class="flex items-center text-still-text">
                            <input type="checkbox" id="gen-blog" class="rounded border-still-border input-premium" >
                            <span class="ml-2">Blog Post</span>
                        </label>
                    </div>
                </div>

                <div id="selected-atoms-preview" class="p-3 bg-still-bg rounded text-sm border border-still-border">
                    <strong class="text-still-text">Selected atoms:</strong>
                    <div id="atoms-preview-list" class="mt-2 space-y-1"></div>
                </div>
            </div>

            <div class="mt-6 flex gap-3">
                <button id="cancel-generate" class="flex-1 px-4 py-2 border border-still-border rounded-lg text-still-text hover:bg-still-border transition">
                    Cancel
                </button>
                <button id="confirm-generate" class="flex-1 px-4 py-2 btn btn-primary text-white rounded-lg transition">
                    Generate
                </button>
            </div>
        </div>
    </div>

    <!-- Copy Toast -->
    <div id="copy-toast" class="fixed bottom-4 right-4 bg-still-card text-still-text px-4 py-2 rounded-lg shadow-lg border border-still-border hidden">
        Copied to clipboard!
    </div>

    <script>
        // Require authentication
        Auth.requireAuth();

        let allEntries = [];
        let selectedIds = new Set();
        let currentPage = 0;
        const pageSize = 24;

        function getTypeColor(type) {
            const colors = {
                'data': 'still-copper',
                'story': 'still-green',
                'insight': 'still-amber',
                'problem': 'still-error',
                'solution': 'still-copper'
            };
            return colors[type] || 'still-muted';
        }

        function getTypeBorderClass(type) {
            const borders = {
                'data': 'border-l-[#B87333]',
                'story': 'border-l-[#4A7C59]',
                'insight': 'border-l-[#D4A574]',
                'problem': 'border-l-[#C45C4A]',
                'solution': 'border-l-[#B87333]'
            };
            return borders[type] || 'border-l-[#A3A3A3]';
        }

        function getTypeTextClass(type) {
            const texts = {
                'data': 'text-[#B87333]',
                'story': 'text-[#4A7C59]',
                'insight': 'text-[#D4A574]',
                'problem': 'text-[#C45C4A]',
                'solution': 'text-[#B87333]'
            };
            return texts[type] || 'text-[#A3A3A3]';
        }

        // copyToClipboard is now provided by utils.js

        function updateSelectedCount() {
            document.getElementById('selected-count').textContent = selectedIds.size;
            document.getElementById('generate-btn').disabled = selectedIds.size === 0;
        }

        function toggleSelect(id, content) {
            if (selectedIds.has(id)) {
                selectedIds.delete(id);
            } else {
                selectedIds.add(id);
            }
            updateSelectedCount();

            // Update card styling
            const card = document.querySelector(`[data-entry-id="${id}"]`);
            if (card) {
                card.classList.toggle('ring-2', selectedIds.has(id));
                card.classList.toggle('ring-still-copper', selectedIds.has(id));
            }
        }

        function renderLibrary(entries) {
            const container = document.getElementById('library-container');
            container.innerHTML = '';

            // Guard against undefined entries (can happen during auth redirect)
            if (!entries || entries.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12">
                        <p class="text-still-muted">No entries found</p>
                        <a href="/upload.html" class="text-still-copper hover:underline mt-2 inline-block">
                            Upload content to build your library
                        </a>
                    </div>
                `;
                return;
            }

            entries.forEach(entry => {
                const borderClass = getTypeBorderClass(entry.entry_type);
                const textClass = getTypeTextClass(entry.entry_type);
                const isSelected = selectedIds.has(entry.id);

                const card = document.createElement('div');
                card.className = `bg-still-card p-4 rounded-lg shadow-sm border-l-4 ${borderClass} cursor-pointer hover:bg-still-border transition ${isSelected ? 'ring-2 ring-still-copper' : ''}`;
                card.dataset.entryId = entry.id;

                const relevance = entry.persona_relevance ? Object.entries(entry.persona_relevance).map(([k, v]) => `${k.split('_')[0]}: ${v}`).join(', ') : '';

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-xs font-semibold ${textClass} uppercase">${entry.entry_type}</span>
                        <input type="checkbox" ${isSelected ? 'checked' : ''}
              class="rounded border-still-border input-premium" onclick="event.stopPropagation(); toggleSelect(${entry.id}, '${entry.content.replace(/'/g, "\\'")}')">
                    </div>
                    <p class="text-still-text text-sm line-clamp-3">${escapeHtml(entry.content)}</p>
                    <div class="mt-3 flex flex-wrap gap-1">
                        ${entry.tags && entry.tags.length ? entry.tags.slice(0, 3).map(tag =>
                            `<span class="text-xs px-2 py-0.5 bg-still-border text-still-muted rounded">${escapeHtml(tag)}</span>`
                        ).join('') : ''}
                    </div>
                    <div class="mt-2 flex justify-between text-xs text-still-disabled">
                        <span>Used ${entry.times_used || 0}x</span>
                        ${relevance ? `<span>${relevance}</span>` : ''}
                    </div>
                `;

                card.addEventListener('click', (e) => {
                    if (e.target.type !== 'checkbox') {
                        toggleSelect(entry.id, entry.content);
                        const checkbox = card.querySelector('input[type="checkbox"]');
                        checkbox.checked = selectedIds.has(entry.id);
                    }
                });

                container.appendChild(card);
            });
        }

        // escapeHtml is now provided by utils.js

        // Load personas dynamically
        async function loadPersonas() {
            try {
                const response = await Auth.fetchWithAuth('/api/personas');
                const data = await response.json();

                const filterSelect = document.getElementById('filter-persona');
                const genSelect = document.getElementById('gen-persona');

                // Clear and reset filter-persona
                filterSelect.innerHTML = '<option value="">All Personas</option>';

                // Clear gen-persona
                genSelect.innerHTML = '';

                // Add custom personas first (if any)
                if (data.custom_personas && data.custom_personas.length > 0) {
                    const filterCustomGroup = document.createElement('optgroup');
                    filterCustomGroup.label = 'Your Custom Personas';
                    const genCustomGroup = document.createElement('optgroup');
                    genCustomGroup.label = 'Your Custom Personas';

                    data.custom_personas.forEach(p => {
                        const filterOption = document.createElement('option');
                        filterOption.value = p.id;
                        filterOption.textContent = `${p.name} (${p.role})`;
                        filterCustomGroup.appendChild(filterOption);

                        const genOption = document.createElement('option');
                        genOption.value = p.id;
                        genOption.textContent = `${p.name} (${p.role})`;
                        genCustomGroup.appendChild(genOption);
                    });
                    filterSelect.appendChild(filterCustomGroup);
                    genSelect.appendChild(genCustomGroup);
                }

                // Add default personas
                if (data.default_personas && data.default_personas.length > 0) {
                    const filterDefaultGroup = document.createElement('optgroup');
                    filterDefaultGroup.label = 'Default Personas';
                    const genDefaultGroup = document.createElement('optgroup');
                    genDefaultGroup.label = 'Default Personas';

                    data.default_personas.forEach(p => {
                        const filterOption = document.createElement('option');
                        filterOption.value = p.id;
                        filterOption.textContent = p.title;
                        filterDefaultGroup.appendChild(filterOption);

                        const genOption = document.createElement('option');
                        genOption.value = p.id;
                        genOption.textContent = p.title;
                        genDefaultGroup.appendChild(genOption);
                    });
                    filterSelect.appendChild(filterDefaultGroup);
                    genSelect.appendChild(genDefaultGroup);
                }
            } catch (err) {
                console.error('Failed to load personas:', err);
                // Fallback to hardcoded options
                const filterSelect = document.getElementById('filter-persona');
                const genSelect = document.getElementById('gen-persona');
                const fallbackOptions = `
                    <option value="ceo_longterm_care">CEO of Long-Term Care Facility</option>
                    <option value="don_memory_care">Director of Nursing (Memory Care)</option>
                    <option value="marketing_director">Marketing Director (Senior Living)</option>
                `;
                filterSelect.innerHTML = '<option value="">All Personas</option>' + fallbackOptions;
                genSelect.innerHTML = fallbackOptions;
            }
        }

        async function loadLibrary() {
            const type = document.getElementById('filter-type').value;
            const persona = document.getElementById('filter-persona').value;
            const minRelevance = document.getElementById('filter-relevance').value;
            const search = document.getElementById('filter-search').value;

            const params = new URLSearchParams();
            if (type) params.set('entry_type', type);
            if (persona) params.set('persona', persona);
            if (minRelevance) params.set('min_relevance', minRelevance);
            if (search) params.set('search', search);
            params.set('limit', pageSize);
            params.set('offset', currentPage * pageSize);

            try {
                const response = await Auth.fetchWithAuth(`/api/library?${params}`);
                if (!response.ok) {
                    console.error('Library API error:', response.status);
                    return;
                }
                const data = await response.json();

                document.getElementById('library-stats').textContent =
                    `${data.total || 0} entries in library`;

                allEntries = data.entries || [];
                renderLibrary(allEntries);

                // Render pagination
                const totalPages = Math.ceil(data.total / pageSize);
                const pagination = document.getElementById('pagination');
                pagination.innerHTML = '';

                if (totalPages > 1) {
                    for (let i = 0; i < totalPages; i++) {
                        const btn = document.createElement('button');
                        btn.textContent = i + 1;
                        btn.className = `px-3 py-1 rounded ${i === currentPage ? 'copper-gradient text-white' : 'bg-still-border text-still-text hover:bg-still-muted'}`;
                        btn.onclick = () => {
                            currentPage = i;
                            loadLibrary();
                        };
                        pagination.appendChild(btn);
                    }
                }

            } catch (err) {
                console.error('Failed to load library:', err);
            }
        }

        // Load stats
        async function loadStats() {
            try {
                const response = await Auth.fetchWithAuth('/api/library/stats');
                if (!response.ok) {
                    console.error('Stats API error:', response.status);
                    return;
                }
                const data = await response.json();

                document.getElementById('library-stats').textContent =
                    `${data.total_entries || 0} total entries`;
            } catch (err) {
                console.error('Failed to load stats:', err);
            }
        }

        // Event listeners
        document.getElementById('apply-filters').addEventListener('click', () => {
            currentPage = 0;
            loadLibrary();
        });

        document.getElementById('filter-search').addEventListener('keyup', (e) => {
            if (e.key === 'Enter') {
                currentPage = 0;
                loadLibrary();
            }
        });

        document.getElementById('generate-btn').addEventListener('click', () => {
            // Populate preview
            const previewList = document.getElementById('atoms-preview-list');
            previewList.innerHTML = '';

            const selectedEntries = allEntries.filter(e => selectedIds.has(e.id));
            selectedEntries.forEach(entry => {
                const div = document.createElement('div');
                div.className = 'text-still-muted';
                div.textContent = `• ${entry.content.substring(0, 60)}...`;
                previewList.appendChild(div);
            });

            document.getElementById('generate-modal').classList.remove('hidden');
        });

        document.getElementById('cancel-generate').addEventListener('click', () => {
            document.getElementById('generate-modal').classList.add('hidden');
        });

        document.getElementById('confirm-generate').addEventListener('click', async () => {
            const persona = document.getElementById('gen-persona').value;
            const assetTypes = [];
            const assetQuantities = {};

            if (document.getElementById('gen-linkedin').checked) {
                assetTypes.push('linkedin');
                assetQuantities.linkedin = parseInt(document.getElementById('gen-linkedin-qty').value);
            }
            if (document.getElementById('gen-blog').checked) {
                assetTypes.push('blog');
                assetQuantities.blog = 1;
            }

            if (assetTypes.length === 0) {
                alert('Please select at least one content type');
                return;
            }

            try {
                const response = await Auth.fetchWithAuth('/api/generate-from-library', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        atom_ids: Array.from(selectedIds),
                        target_persona: persona,
                        asset_types: assetTypes,
                        asset_quantities: assetQuantities
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    window.location.href = `/status.html?job_id=${data.job_id}`;
                } else {
                    throw new Error(data.detail || 'Generation failed');
                }
            } catch (err) {
                alert('Error: ' + err.message);
            }
        });

        // Initial load
        loadPersonas();
        loadLibrary();
        loadStats();
    </script>
</body>
</html>
