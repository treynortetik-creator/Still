<!DOCTYPE html>
<html lang="en" data-theme="dark" class="no-transitions">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/static/images/Icon only.png">
    <title>Create Account - Still</title>
    <meta name="description" content="Create your Still account to start transforming your content with AI.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="/static/theme.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        still: {
                            bg: 'var(--still-bg)',
                            card: 'var(--still-card)',
                            border: 'var(--still-border)',
                            text: 'var(--still-text)',
                            muted: 'var(--still-muted)',
                            disabled: 'var(--still-disabled)',
                            copper: 'var(--still-copper)',
                            amber: 'var(--still-amber)',
                            green: 'var(--still-green)',
                            error: 'var(--still-error)',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/error-logger.js"></script>
    <style>
        .auth-gradient-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.4;
            pointer-events: none;
        }
        .auth-orb-1 {
            width: 500px;
            height: 500px;
            background: rgba(212, 117, 43, 0.3);
            top: -150px;
            right: -100px;
            animation: float-slow 20s ease-in-out infinite;
        }
        .auth-orb-2 {
            width: 400px;
            height: 400px;
            background: rgba(233, 168, 114, 0.2);
            bottom: -100px;
            left: -100px;
            animation: float-slow 25s ease-in-out infinite reverse;
        }
        @keyframes float-slow {
            0%, 100% { transform: translateY(0) translateX(0); }
            50% { transform: translateY(-30px) translateX(20px); }
        }
        /* Password strength bar */
        .strength-bar {
            height: 4px;
            border-radius: 2px;
            background: var(--surface-subtle);
            transition: background 0.2s ease;
        }
        .strength-bar.weak { background: var(--error); }
        .strength-bar.fair { background: var(--warning); }
        .strength-bar.good { background: var(--still-amber); }
        .strength-bar.strong { background: var(--success); }
    </style>
    <script>
        window.addEventListener('load', () => {
            document.documentElement.classList.remove('no-transitions');
        });
    </script>
</head>
<body class="bg-still-bg min-h-screen flex items-center justify-center relative overflow-hidden">
    <!-- Background gradient orbs -->
    <div class="auth-gradient-orb auth-orb-1" aria-hidden="true"></div>
    <div class="auth-gradient-orb auth-orb-2" aria-hidden="true"></div>

    <!-- Theme Toggle -->
    <div class="fixed top-4 right-4 z-10">
        <button onclick="ThemeManager.toggle()" class="theme-toggle" title="Toggle light/dark mode" aria-label="Toggle theme">
            <svg class="theme-icon-sun w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
            </svg>
            <svg class="theme-icon-moon hidden w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
            </svg>
        </button>
    </div>

    <main class="max-w-md w-full mx-4 relative z-10 py-12">
        <!-- Logo/Header -->
        <div class="text-center mb-10 animate-fade-in-up">
            <a href="/" class="inline-block mb-6">
                <img src="/static/images/Still Logo.svg" alt="Still" class="h-16 mx-auto">
            </a>
            <h1 class="text-2xl font-bold text-still-text mb-2">Create your account</h1>
            <p class="text-still-muted">Start transforming your content with AI</p>
        </div>

        <!-- Register Form -->
        <div class="card-premium p-8 animate-fade-in-up animate-delay-1">
            <form id="register-form" class="space-y-6" novalidate>
                <div>
                    <label for="email" class="form-label form-label-required">Email address</label>
                    <input type="email" id="email" name="email" required autocomplete="email"
                           class="input-premium" placeholder="you@example.com"
                           aria-required="true">
                </div>

                <div>
                    <label for="password" class="form-label form-label-required">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="new-password"
                           class="input-premium" placeholder="Create a strong password"
                           aria-required="true" aria-describedby="password-requirements">
                    <p id="password-requirements" class="form-helper">8+ characters with uppercase, lowercase, and number</p>

                    <!-- Password strength indicator -->
                    <div id="password-strength" class="hidden mt-3">
                        <div class="flex gap-1 mb-2">
                            <div class="strength-bar flex-1" id="strength-1"></div>
                            <div class="strength-bar flex-1" id="strength-2"></div>
                            <div class="strength-bar flex-1" id="strength-3"></div>
                            <div class="strength-bar flex-1" id="strength-4"></div>
                        </div>
                        <p class="text-xs" id="strength-text"></p>
                    </div>
                </div>

                <div>
                    <label for="confirm-password" class="form-label form-label-required">Confirm password</label>
                    <input type="password" id="confirm-password" name="confirm_password" required autocomplete="new-password"
                           class="input-premium" placeholder="Confirm your password"
                           aria-required="true">
                </div>

                <!-- Error Message -->
                <div id="error-message" class="hidden p-4 rounded-lg border-l-4 border-l-still-error" style="background: var(--error-subtle);" role="alert">
                    <div class="flex items-start gap-3">
                        <svg class="w-5 h-5 text-still-error flex-shrink-0" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
                        </svg>
                        <p class="text-still-error text-sm" id="error-text"></p>
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="btn btn-primary-glow btn-lg w-full">
                    Create account
                </button>
            </form>

            <div class="mt-8 pt-6 border-t text-center" style="border-color: var(--glass-border);">
                <p class="text-sm text-still-muted">
                    Already have an account?
                    <a href="/login.html" class="text-copper-accessible hover:text-still-amber font-semibold underline underline-offset-2 decoration-still-copper/30 hover:decoration-still-amber">
                        Sign in
                    </a>
                </p>
            </div>
        </div>

        <!-- Back to home -->
        <div class="text-center mt-8 animate-fade-in-up animate-delay-2">
            <a href="/" class="inline-flex items-center gap-2 text-still-muted hover:text-still-text text-sm transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                </svg>
                Back to home
            </a>
        </div>
    </main>

    <script>
        // Password strength checker
        document.getElementById('password').addEventListener('input', (e) => {
            const password = e.target.value;
            const strengthDiv = document.getElementById('password-strength');
            const strengthText = document.getElementById('strength-text');

            if (password.length === 0) {
                strengthDiv.classList.add('hidden');
                return;
            }

            strengthDiv.classList.remove('hidden');

            let strength = 0;
            if (password.length >= 8) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[a-z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;

            const classes = ['weak', 'fair', 'good', 'strong'];
            const textColors = ['text-still-error', 'text-still-amber', 'text-still-amber', 'text-still-green'];
            const texts = ['Weak', 'Fair', 'Good', 'Strong'];

            for (let i = 1; i <= 4; i++) {
                const bar = document.getElementById(`strength-${i}`);
                bar.className = 'strength-bar flex-1';
                if (i <= strength && strength > 0) {
                    bar.classList.add(classes[strength - 1]);
                }
            }

            if (strength > 0) {
                strengthText.textContent = texts[strength - 1];
                strengthText.className = `text-xs ${textColors[strength - 1]}`;
            } else {
                strengthText.textContent = '';
            }
        });

        // Check if already logged in
        const token = localStorage.getItem('auth_token');
        if (token) {
            fetch('/api/auth/me', {
                headers: { 'Authorization': `Bearer ${token}` }
            }).then(res => {
                if (res.ok) {
                    window.location.href = '/upload.html';
                }
            });
        }

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = document.getElementById('submit-btn');
            const errorDiv = document.getElementById('error-message');

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            // Client-side validation
            if (password !== confirmPassword) {
                document.getElementById('error-text').textContent = 'Passwords do not match';
                errorDiv.classList.remove('hidden');
                return;
            }

            if (password.length < 8) {
                document.getElementById('error-text').textContent = 'Password must be at least 8 characters';
                errorDiv.classList.remove('hidden');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = `
                <svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Creating account...
            `;
            errorDiv.classList.add('hidden');

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email,
                        password,
                        confirm_password: confirmPassword
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('auth_token', data.access_token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = '/upload.html';
                } else {
                    throw new Error(data.detail || 'Registration failed');
                }
            } catch (err) {
                document.getElementById('error-text').textContent = err.message;
                errorDiv.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Create account';
            }
        });
    </script>
</body>
</html>
