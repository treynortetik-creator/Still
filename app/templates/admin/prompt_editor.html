{% extends "base.html" %}

{% block title %}Prompt Editor{% endblock %}
{% block nav_prompts %}active{% endblock %}

{% block content %}
<div class="flex justify-between items-center mb-8">
    <h1 class="text-2xl font-bold">Prompt Editor</h1>
</div>

<div class="grid grid-cols-12 gap-6">
    <!-- Prompt List -->
    <div class="col-span-4">
        <div class="bg-white rounded-lg shadow">
            <div class="px-4 py-3 border-b">
                <h2 class="font-semibold">Templates</h2>
            </div>
            <div id="prompt-list" class="divide-y">
                <div class="px-4 py-3 text-gray-500">Loading...</div>
            </div>
        </div>
    </div>

    <!-- Prompt Editor -->
    <div class="col-span-8">
        <div class="bg-white rounded-lg shadow">
            <div class="px-6 py-4 border-b flex justify-between items-center">
                <div>
                    <h2 class="font-semibold" id="editor-title">Select a template</h2>
                    <div class="text-sm text-gray-500" id="editor-meta"></div>
                </div>
                <button id="save-btn" disabled
                    class="px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed">
                    Save Changes
                </button>
            </div>

            <div class="p-6">
                <!-- Model & Tokens -->
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Model</label>
                        <select id="prompt-model" disabled
                            class="w-full border border-gray-300 rounded px-3 py-2">
                            <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
                            <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                            <option value="claude-opus-4-5-20251101">Claude Opus 4.5</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Max Tokens</label>
                        <input type="number" id="prompt-tokens" disabled
                            class="w-full border border-gray-300 rounded px-3 py-2">
                    </div>
                </div>

                <!-- Variables -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Variables</label>
                    <div id="prompt-variables" class="flex flex-wrap gap-2">
                        <span class="text-gray-400 text-sm">No variables</span>
                    </div>
                </div>

                <!-- Prompt Content -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Prompt Content</label>
                    <textarea id="prompt-content" rows="20" disabled
                        class="w-full border border-gray-300 rounded px-3 py-2 font-mono text-sm"
                        placeholder="Select a template to edit..."></textarea>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Success Toast -->
<div id="success-toast" class="hidden fixed bottom-4 right-4 bg-green-600 text-white px-4 py-2 rounded-lg shadow-lg">
    Changes saved successfully!
</div>
{% endblock %}

{% block scripts %}
<script>
let currentTemplate = null;

async function loadPrompts() {
    try {
        const response = await fetch('/admin/prompts');
        const data = await response.json();

        const listDiv = document.getElementById('prompt-list');
        listDiv.innerHTML = data.prompts.map(prompt => `
            <button onclick="loadPrompt('${prompt.template_name}')"
                class="w-full px-4 py-3 text-left hover:bg-gray-50 transition prompt-item"
                data-name="${prompt.template_name}">
                <div class="font-medium">${prompt.template_name.replace(/_/g, ' ')}</div>
                <div class="text-xs text-gray-500">${prompt.model} | v${prompt.version}</div>
            </button>
        `).join('');
    } catch (err) {
        console.error('Failed to load prompts:', err);
    }
}

async function loadPrompt(templateName) {
    try {
        const response = await fetch(`/admin/prompts/${templateName}`);
        const data = await response.json();

        currentTemplate = templateName;

        // Update UI
        document.getElementById('editor-title').textContent = templateName.replace(/_/g, ' ');
        document.getElementById('editor-meta').textContent = `Version ${data.version} | Updated ${new Date(data.updated_at).toLocaleDateString()}`;

        document.getElementById('prompt-model').value = data.model;
        document.getElementById('prompt-model').disabled = false;

        document.getElementById('prompt-tokens').value = data.max_tokens;
        document.getElementById('prompt-tokens').disabled = false;

        // Variables
        const varsDiv = document.getElementById('prompt-variables');
        if (data.variables && data.variables.length > 0) {
            varsDiv.innerHTML = data.variables.map(v =>
                `<code class="px-2 py-1 bg-gray-100 rounded text-sm">{${v}}</code>`
            ).join('');
        } else {
            varsDiv.innerHTML = '<span class="text-gray-400 text-sm">No variables</span>';
        }

        document.getElementById('prompt-content').value = data.prompt_content;
        document.getElementById('prompt-content').disabled = false;

        document.getElementById('save-btn').disabled = false;

        // Highlight selected
        document.querySelectorAll('.prompt-item').forEach(el => {
            el.classList.toggle('bg-indigo-50', el.dataset.name === templateName);
        });
    } catch (err) {
        console.error('Failed to load prompt:', err);
    }
}

async function savePrompt() {
    if (!currentTemplate) return;

    const model = document.getElementById('prompt-model').value;
    const maxTokens = parseInt(document.getElementById('prompt-tokens').value);
    const content = document.getElementById('prompt-content').value;

    try {
        const params = new URLSearchParams();
        params.set('prompt_content', content);
        params.set('model', model);
        params.set('max_tokens', maxTokens);

        const response = await fetch(`/admin/prompts/${currentTemplate}?${params}`, {
            method: 'PUT'
        });

        if (response.ok) {
            const data = await response.json();

            // Show success toast
            const toast = document.getElementById('success-toast');
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);

            // Update version display
            document.getElementById('editor-meta').textContent =
                `Version ${data.version} | Updated just now`;

            // Reload list to update version
            loadPrompts();
        } else {
            throw new Error('Failed to save');
        }
    } catch (err) {
        alert('Failed to save changes: ' + err.message);
    }
}

document.getElementById('save-btn').addEventListener('click', savePrompt);

// Initial load
loadPrompts();
</script>
{% endblock %}
